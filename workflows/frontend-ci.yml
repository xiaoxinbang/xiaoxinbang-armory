# 孝心帮前端 CI 工作流
# 适用于 uni-app + Vue 项目

name: Frontend CI

on:
  push:
    paths:
      - 'src/**'
      - 'pages.json'
      - 'manifest.json'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm ci

      - name: Lint Check
        run: npx eslint src/ --ext .vue,.js

      - name: Build
        run: npm run build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
