# 孝心帮全自动工作流（本地/CI 通用编排）
# v2.0 — 新增五帮飞轮审计阶段
# 通过 Claude Code 智能体团队执行

name: 全自动工作流
version: 2.0.0

on:
  code_change:    # 代码变更
  schedule:       # 定时任务
  manual:         # 手动触发

jobs:
  # ============================================
  # 阶段0: 五帮飞轮审计
  # ============================================
  flywheel-audit:
    name: "阶段0 - 五帮飞轮链路审计"
    agents: [codegraph, understand-anything]

    steps:
      - agent: codegraph
        task: 扫描五帮页面覆盖度，输出飞轮阶段覆盖矩阵
        output: flywheel-coverage.yaml

      - agent: understand-anything
        task: 检测飞轮断裂点(检查每个阶段是否有到下一阶段的触发)
        output: flywheel-gaps.md

      - condition: gaps_found
        action: 自动创建Issue标记断裂点

  # ============================================
  # 阶段1: 代码理解与分析
  # ============================================
  analyze:
    name: "阶段1 - 代码理解与分析"
    agents: [codegraph, understand-anything]
    needs: [flywheel-audit]

    steps:
      - agent: codegraph
        task: 扫描项目结构，构建知识图谱
        output: knowledge-graph.yaml

      - agent: understand-anything
        task: 分析变更影响范围，评估风险等级
        output: impact-analysis.md

  # ============================================
  # 阶段2: 开发与代码生成
  # ============================================
  develop:
    name: "阶段2 - 开发与代码生成"
    agents: [karpathy-skills, claude-plugins]
    needs: [analyze]

    steps:
      - agent: karpathy-skills
        task: 根据变更需求编写 CLAUDE.md 工作指令
        output: .claude/skills/

      - agent: claude-plugins
        task: 激活对应插件的开发模式
        config: plugins.dev-mode

  # ============================================
  # 阶段3: 沙盒测试与验证
  # ============================================
  test:
    name: "阶段3 - 沙盒测试与验证"
    agents: [claude-plugins]
    needs: [develop]

    steps:
      - name: 沙盒环境启动
        run: cd sandbox && docker-compose up -d

      - name: 飞轮E2E闭环测试
        run: node sandbox/tests/e2e/flywheel-full-cycle.test.js

      - name: 前端构建测试
        run: cd sandbox/frontend && npm run build

      - name: 后端启动测试
        run: cd sandbox/backend && npm start

      - name: 集成测试
        run: cd sandbox && npm test

      - name: 断裂点检测
        run: node scripts/detect-gaps.js

      - name: 沙盒清理
        run: cd sandbox && docker-compose down

  # ============================================
  # 阶段4: 智能代码审查
  # ============================================
  review:
    name: "阶段4 - 智能代码审查"
    agents: [understand-anything, claude-plugins]
    needs: [test]

    steps:
      - agent: understand-anything
        task: 全量代码审查，检查潜在问题

      - agent: claude-plugins
        task: 运行质量门禁检查
        rules:
          - 测试覆盖率 >= 80%
          - 无高危安全漏洞
          - 代码风格符合规范

  # ============================================
  # 阶段5: 文档生成与发布
  # ============================================
  publish:
    name: "阶段5 - 文档生成与发布"
    agents: [presenton, longlive]
    needs: [review]

    steps:
      - agent: presenton
        task: 生成版本发布文档/PPT（含五帮内容）
        template: release-notes

      - agent: longlive
        task: 生成新功能介绍视频（可选）

      - agent: claude-plugins
        task: 执行部署流程
